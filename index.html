        <style>
                :root {
                        --brand: #1eaffb;
                        --brand-dark: #0b8fd6;
                        --bg: #f4f9fd;
                        --card: #ffffff;
                        --text: #0f1b2a;
                        --muted: #5b6b7d;
                        --line: #e3edf5;
                }

                @media (prefers-color-scheme: dark) {
                        :root {
                                --bg: #0b1520;
                                --card: #13212f;
                                --text: #e8f1f8;
                                --muted: #8fa3b6;
                                --line: #1f3244;
                        }
                }

                * { box-sizing: border-box; margin: 0; padding: 0; }

                body {
                        min-height: 100vh;
                        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                        color: var(--text);
                        background:
                                radial-gradient(1200px 500px at 50% -200px, rgba(30, 175, 251, .22), transparent 70%),
                                var(--bg);
                        display: flex;
                        justify-content: center;
                        padding: 64px 16px 40px;
                        -webkit-font-smoothing: antialiased;
                }

                main { width: 100%; max-width: 440px; }

                .profile { text-align: center; margin-bottom: 32px; }

                .avatar {
                        width: 96px;
                        height: 96px;
                        margin: 0 auto 16px;
                        border-radius: 50%;
                        display: block;
                        object-fit: cover;
                        background: var(--line);
                        box-shadow: 0 0 0 4px var(--card), 0 0 0 6px rgba(30, 175, 251, .35), 0 12px 30px rgba(30, 175, 251, .3);
                }

                h1 { font-size: 24px; font-weight: 700; letter-spacing: -.4px; }

                .tagline { margin-top: 6px; font-size: 15px; color: var(--muted); }

                .links { display: flex; flex-direction: column; gap: 12px; list-style: none; }

                .link {
                        display: flex;
                        align-items: center;
                        gap: 14px;
                        padding: 14px 16px;
                        border-radius: 16px;
                        background: var(--card);
                        border: 1px solid var(--line);
                        color: var(--text);
                        text-decoration: none;
                        box-shadow: 0 1px 2px rgba(15, 27, 42, .04);
                        transition: transform .2s cubic-bezier(.08, .59, .29, .99), box-shadow .2s, border-color .2s;
                }

                .link:hover, .link:focus-visible {
                        transform: translateY(-2px);
                        border-color: var(--brand);
                        box-shadow: 0 10px 24px rgba(30, 175, 251, .18);
                        outline: none;
                }

                .link:active { transform: translateY(0); }

                .icon {
                        flex: none;
                        width: 44px;
                        height: 44px;
                        border-radius: 12px;
                        display: grid;
                        place-items: center;
                        color: #fff;
                        background: var(--brand);
                }

                .icon svg { width: 22px; height: 22px; fill: currentColor; }

                .icon.whatsapp { background: #25d366; }
                .icon.linkedin { background: #0a66c2; }

                .label { flex: 1; min-width: 0; }
                .label strong { display: block; font-size: 16px; font-weight: 600; }
                .label span { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }

                .arrow { flex: none; color: var(--muted); transition: transform .2s, color .2s; }
                .link:hover .arrow { color: var(--brand); transform: translateX(3px); }

                footer { margin-top: 40px; text-align: center; font-size: 13px; color: var(--muted); }
        </style>
</head>
