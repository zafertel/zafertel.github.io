  .link:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.06)}
  .link:active{transform:scale(.98)}
  .ic{flex:none;width:2.75rem;height:2.75rem;border-radius:.75rem;background:var(--card-2);display:grid;place-items:center}
  .ic svg{width:1.25rem;height:1.25rem;fill:currentColor}
  .link.primary{background:var(--ink);color:#fff}

  .txt{flex:1;min-width:0}

  .txt > span{display:block;font-size:.875rem;color:var(--ink-2);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link.primary .txt > span{color:rgba(255,255,255,.65)}
  .arr{color:var(--ink-3)}

  footer{text-align:center;margin-top:2rem;color:var(--ink-3)}

<script>
  (function(){
    var root=document.documentElement, btns=document.querySelectorAll('[data-set-lang]');
    function set(l){
      root.setAttribute('data-lang',l); root.lang=l;
      btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.setLang===l)});
      try{localStorage.setItem('lang',l)}catch(e){}
    }
    var saved=null; try{saved=localStorage.getItem('lang')}catch(e){}
    set(saved || ((navigator.language||'').slice(0,2)==='tr'?'tr':'en'));
    btns.forEach(function(b){b.addEventListener('click',function(){set(b.dataset.setLang)})});
  })();
</script>
